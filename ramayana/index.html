<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Path of Ram | श्रीराम वन गमन पथ</title>
<meta name="description" content="Walk Ram's 14 year exile from Ayodhya to Lanka and back on an interactive map of India. 27 stops, what happened at each, and what stands there today. In English and Hindi.">
<meta property="og:type" content="website">
<meta property="og:title" content="The Path of Ram: Ayodhya to Lanka, stop by stop">
<meta property="og:description" content="An interactive map of Ram's 14 year exile. Tap each stop to see what happened there and what stands there today.">
<meta property="og:url" content="https://thesaptarshi.com/ramayana/">
<meta property="og:image" content="https://thesaptarshi.com/ramayana/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#4a0b10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6c6 10 10 16 10 22a10 10 0 0 1-20 0c0-6 4-12 10-22z' fill='%23f6a623'/%3E%3Cpath d='M6 40h52c-2 10-12 16-26 16S8 50 6 40z' fill='%23b5361f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Tiro+Devanagari+Hindi&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#4a0b10; --maroon2:#6e1219; --maroon3:#8c1a1f; --vermilion:#c8321e; --saffron:#ec7a1c;
  --saffron2:#ffa53a; --gold:#d6a43c; --gold2:#f3cf76; --parch:#f6e7c6; --parch2:#ecd6a6; --parch3:#e0c48a;
  --ink:#3b1d10; --ink2:#6b4426; --teal:#0f5c5e; --sea:#16323f; --sea2:#1d4253;
  --ram:#ec7a1c; --hanu:#d2361f; --push:#e9b949; --alt:#1b7a74;
  --serif:'Lora',Georgia,serif; --display:'Cinzel',Georgia,serif;
  --hi:'Tiro Devanagari Hindi',serif; --hidisplay:'Yatra One',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--maroon);color:var(--parch);font-family:var(--serif);line-height:1.55;overflow-x:hidden}
body.hi{font-family:var(--hi)}
body.hi .disp{font-family:var(--hidisplay);letter-spacing:0}
.disp{font-family:var(--display);letter-spacing:.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--gold2)}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:linear-gradient(#3a080cf2,#3a080cd9);backdrop-filter:blur(8px);
  border-bottom:1px solid #d6a43c55}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--gold2);text-decoration:none}
.brand svg{width:22px;height:22px}
.tb-right{display:flex;gap:8px;align-items:center}
.pill{border:1px solid #d6a43c99;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--parch);display:inline-flex;align-items:center;gap:6px}
.pill:active{transform:scale(.96)}
.lang{display:flex;border:1px solid #d6a43c99;border-radius:999px;overflow:hidden;font-size:13px}
.lang button{padding:6px 11px;color:var(--parch2)}
.lang button.on{background:var(--gold);color:var(--maroon);font-weight:600}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:120px 22px 150px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#8c1a1f 0%,#5a0d13 45%,#330609 100%)}
.toran{position:absolute;top:calc(env(safe-area-inset-top) + 48px);left:0;right:0;height:64px;z-index:2;pointer-events:none}
.mandala{position:absolute;width:min(130vw,820px);aspect-ratio:1;left:50%;top:46%;transform:translate(-50%,-50%);opacity:.22;z-index:0}
.mandala svg{width:100%;height:100%;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-in{position:relative;z-index:3;max-width:720px}
.kicker{font-family:var(--hidisplay);color:var(--gold2);font-size:20px;letter-spacing:.06em;opacity:0;animation:rise 1s .2s forwards}
.hero h1{font-size:clamp(40px,10vw,78px);line-height:1.05;margin:10px 0 6px;color:var(--parch);
  text-shadow:0 2px 0 #2a0507,0 0 40px #ec7a1c55;opacity:0;animation:rise 1s .4s forwards}
body.hi .hero h1{font-size:clamp(38px,10vw,74px);line-height:1.25}
.hero h1 .accent{color:var(--gold2);display:block;font-size:.42em;letter-spacing:.18em;margin-top:6px}
body.hi .hero h1 .accent{letter-spacing:.04em}
.hero p.sub{font-size:clamp(16px,4.2vw,20px);color:var(--parch2);max-width:560px;margin:14px auto 0;opacity:0;animation:rise 1s .6s forwards}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:440px;margin:22px auto 26px;opacity:0;animation:rise 1s .8s forwards}
.stat{border:1px solid #d6a43c88;background:#2a050855;border-radius:12px;padding:8px 4px}
.stat b{display:block;font-family:var(--display);font-size:clamp(17px,5vw,22px);color:var(--gold2);line-height:1.1}
body.hi .stat b{font-family:var(--hidisplay)}
.stat span{font-size:12px;color:var(--parch2)}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;opacity:0;animation:rise 1s 1s forwards}
.btn{border-radius:999px;padding:13px 22px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(180deg,#ffb347,#ec7a1c);color:#3a0a06;box-shadow:0 6px 24px #ec7a1c66,inset 0 1px 0 #fff6}
.btn-ghost{border:1px solid var(--gold);color:var(--gold2)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.diyas{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:clamp(18px,6vw,48px);z-index:3}
.diya{width:46px;height:46px}
.diya .flame{transform-origin:50% 90%;animation:flick 1.6s ease-in-out infinite alternate}
.diya:nth-child(2n) .flame{animation-duration:1.2s}
.diya:nth-child(3n) .flame{animation-duration:1.9s}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
.petals{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;top:-30px;width:14px;height:14px;border-radius:70% 0 70% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(var(--drift),110svh) rotate(540deg)}}
.scrollcue{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--parch2);opacity:.75;z-index:3}

/* ---------- map section ---------- */
.mapwrap{position:relative;height:100svh;background:var(--sea);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:none}
.mapframe{position:absolute;inset:0;pointer-events:none;border:6px solid transparent;
  border-image:repeating-linear-gradient(90deg,var(--gold) 0 10px,var(--maroon2) 10px 14px) 6;z-index:4;opacity:.75}
.legend{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 58px);z-index:6;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.legend::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:999px;
  background:#2a0508d9;border:1px solid #d6a43c66;color:var(--parch);white-space:nowrap}
.chip i{width:18px;height:0;border-top:3px solid var(--ram);display:inline-block;border-radius:2px}
.chip.hanu i{border-top:3px dashed var(--hanu)}
.chip.push i{border-top:3px dotted var(--push)}
.chip.alt i{width:10px;height:10px;border:2px solid var(--alt);background:#e8f3ef;transform:rotate(45deg);border-radius:2px}
.chip.off{opacity:.45}
.zoomctl{position:absolute;right:10px;z-index:6;display:flex;flex-direction:column;gap:6px;top:calc(env(safe-area-inset-top) + 104px)}
.zoomctl button{width:38px;height:38px;border-radius:10px;background:#2a0508d9;border:1px solid #d6a43c66;font-size:20px;color:var(--gold2);display:grid;place-items:center}
.zoomctl svg{width:18px;height:18px}

/* card / bottom sheet */
.sheet{position:absolute;z-index:7;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);max-height:47svh;display:flex;flex-direction:column;
  background:var(--parch);color:var(--ink);border-radius:18px;box-shadow:0 -8px 40px #0008;overflow:hidden;
  border:2px solid var(--gold);outline:4px solid #4a0b10;outline-offset:-8px}
.sheet::before{content:"";position:absolute;inset:6px;border:1px solid #b5823388;border-radius:12px;pointer-events:none}
.progress{height:5px;background:#e0c48a;position:relative;flex:none}
.progress b{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--saffron),var(--vermilion));transition:width .8s ease}
.sheet-body{padding:14px 18px 6px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 12px;border-top:1px solid #d9bd85;background:#f1dfb9}
.navbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--maroon2);color:var(--parch)}
.navbtn:disabled{opacity:.35}
.navbtn svg{width:20px;height:20px}
.navbtn.play{background:linear-gradient(180deg,#ffb347,#ec7a1c);color:#3a0a06;width:52px;height:52px}
.navmid{flex:1;text-align:center;font-size:12px;color:var(--ink2);line-height:1.3}
.navmid b{display:block;font-size:13px;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#ead3a2;color:var(--ink2);border:1px solid #c9a565}
.tag.v{background:#7a1520;color:var(--gold2);border-color:#7a1520}
.tag.t{background:var(--alt);color:#eafff9;border-color:var(--alt)}
.tag.when{background:var(--saffron);color:#3a0a06;border-color:var(--saffron)}
.ctitle{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;
  background:radial-gradient(circle at 35% 30%,#a8262c,#5a0d13);color:var(--gold2);border:2px solid var(--gold);box-shadow:0 2px 0 #0003}
.ctitle h2{font-size:21px;line-height:1.2;color:var(--maroon)}
body.hi .ctitle h2{font-size:22px;line-height:1.35}
.place{font-size:13px;color:var(--ink2);margin:6px 0 10px;display:flex;align-items:center;gap:4px}
.place svg{width:14px;height:14px;flex:none;color:var(--vermilion)}
.sec{margin:10px 0}
.sec h3{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--vermilion);margin-bottom:3px;display:flex;align-items:center;gap:6px}
body.hi .sec h3{font-family:var(--hidisplay);letter-spacing:.02em;font-size:15px;text-transform:none}
.sec h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#c8321e66,transparent)}
.sec p{font-size:15.5px}
body.hi .sec p{font-size:17px;line-height:1.7}
.note{background:#f9eccd;border-left:3px solid var(--gold);padding:7px 10px;border-radius:6px;font-size:14px;font-style:italic;color:var(--ink2)}
body.hi .note{font-style:normal;font-size:15.5px}
.cardact{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.mini{font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid #b58233;color:var(--maroon);display:inline-flex;align-items:center;gap:6px;background:#fff6}
.mini.on{background:var(--maroon2);color:var(--gold2);border-color:var(--maroon2)}
.mini svg{width:16px;height:16px}
.km{font-size:12px;color:var(--ink2);margin-top:4px}
.km b{color:var(--vermilion)}
.swipehint{font-size:11px;color:#8a6a45;text-align:center;margin:2px 0 4px}
.endglow{text-align:center}
.endglow .bigdiya{width:84px;height:84px;margin:4px auto 2px;display:block}
.endglow h2{font-size:26px;color:var(--maroon);margin:4px 0 6px}
body.hi .endglow h2{font-family:var(--hidisplay)}
.legendrow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px;margin:10px 0}
.legendrow i{width:28px;border-top:4px solid var(--ram);display:inline-block}
.legendrow i.h{border-top:4px dashed var(--hanu)}
.legendrow i.p{border-top:4px dotted #c9951f}
.legendrow i.a{width:12px;height:12px;border:2px solid var(--alt);background:#e8f3ef;transform:rotate(45deg);margin-left:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(100px);background:var(--ink);color:var(--parch);padding:10px 18px;border-radius:999px;z-index:99;transition:transform .3s;font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0)}

/* svg map styling */
.land{fill:#f4e3bd}
.india{fill:#f6e7c6;stroke:#6e1219;stroke-linejoin:round}
.india-glow{fill:none;stroke:#d6a43c;stroke-linejoin:round;opacity:.55}
.nb{fill:#d9c49a;stroke:#b19a6c}
.lanka{fill:#f6e7c6;stroke:#6e1219}
.river{fill:none;stroke:#5d9aa5;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.rlabel{fill:#3f7f8a;font-style:italic;font-family:var(--serif);paint-order:stroke;stroke:#f6e7c6}
.region{fill:#8c1a1f;opacity:.28;font-family:var(--display);letter-spacing:.25em;text-anchor:middle;font-weight:700}
body.hi .region{font-family:var(--hidisplay);letter-spacing:.05em}
.sealabel{fill:#e9d6a8;opacity:.35;font-style:italic;font-family:var(--serif);text-anchor:middle;letter-spacing:.2em}
body.hi .sealabel{font-family:var(--hi);letter-spacing:.02em}
.seg{fill:none;stroke-linecap:round;stroke-linejoin:round}
.seg.ram{stroke:var(--ram)}
.seg.hanuman{stroke:var(--hanu)}
.seg.pushpak{stroke:var(--push)}
.seg.future{opacity:.38}
.seg-glow{fill:none;stroke:#ffd27a;opacity:.35;stroke-linecap:round}
.mk{cursor:pointer}
.mk .hit{fill:transparent}
.mk .ring{fill:#4a0b10;stroke:#f3cf76}
.mk.done .ring{fill:var(--saffron);stroke:#7a1520}
.mk.push .ring{stroke:#e9b949}
.mk.active .ring{fill:#ffb347;stroke:#7a1520}
.mk .n{fill:#f6e7c6;font-family:var(--display);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.done .n,.mk.active .n{fill:#3a0a06}
.mk .lbl{fill:#3b1d10;font-family:var(--display);font-weight:700;paint-order:stroke;stroke:#f6e7c6;stroke-linejoin:round;pointer-events:none}
body.hi .mk .lbl{font-family:var(--hidisplay);font-weight:400}
.mk .pulse{fill:none;stroke:#ec7a1c;opacity:0}
.mk.active .pulse{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.mk .pulse{transform-box:fill-box;transform-origin:center}
.alt{cursor:pointer}
.alt .d{fill:#e8f3ef;stroke:var(--alt)}
.alt .lbl{fill:#0f5c5e;font-style:italic;font-family:var(--serif);paint-order:stroke;stroke:#f6e7c6;pointer-events:none}
.alt.active .d{fill:var(--alt);stroke:#fff}
.hidden{display:none}
.traveller{pointer-events:none}

/* ---------- list + about ---------- */
.list{background:var(--parch);color:var(--ink);padding:56px 18px 40px;position:relative}
.list::before{content:"";position:absolute;top:0;left:0;right:0;height:14px;
  background:repeating-linear-gradient(90deg,var(--maroon2) 0 14px,var(--gold) 14px 16px)}
.wrap{max-width:760px;margin:0 auto}
.list h2.h{font-size:28px;color:var(--maroon);text-align:center}
.list .lead{text-align:center;color:var(--ink2);margin:6px 0 24px}
.kanda{margin:26px 0 8px;display:flex;align-items:center;gap:10px;color:var(--vermilion);font-size:15px}
.kanda::before,.kanda::after{content:"";flex:1;height:1px;background:#c8321e55}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 6px;border-bottom:1px dashed #c9a565;width:100%;text-align:left;color:var(--ink)}
.row:active{background:#ecd6a6}
.row .num{width:30px;height:30px;font-size:13px}
.row b{display:block;font-size:16px;color:var(--maroon);line-height:1.3}
.row small{color:var(--ink2);font-size:13px}
.row .seen{margin-left:auto;flex:none;width:18px;height:18px;opacity:0}
.row .seen.on{opacity:1}
.about{background:#330609;color:var(--parch2);padding:44px 20px 60px;font-size:15px}
.about h2{color:var(--gold2);font-size:22px;margin-bottom:10px}
.about p{margin:10px 0}
.about ul{margin:8px 0 0 18px}
.about li{margin:4px 0}
.credit{text-align:center;margin-top:28px;color:var(--gold2);font-size:14px}
.credit a{text-decoration:none}
.om{display:block;text-align:center;font-family:var(--hidisplay);color:var(--gold);font-size:22px;margin-top:18px}

@media (min-width:900px){
  .sheet{left:auto;right:16px;top:calc(env(safe-area-inset-top) + 64px);bottom:16px;width:400px;max-height:none}
  .legend{right:440px}
  .zoomctl{right:430px}
}
@media (prefers-reduced-motion:reduce){
  .mandala svg,.petal,.diya .flame,.mk.active .pulse{animation:none!important}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand disp" href="#top" aria-label="Top">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c6 10 10 16 10 22a10 10 0 0 1-20 0c0-6 4-12 10-22z" fill="#f6a623"/><path d="M6 40h52c-2 10-12 16-26 16S8 50 6 40z" fill="#c8321e"/></svg>
    <span data-t="brand"></span>
  </a>
  <div class="tb-right">
    <button class="pill" id="shareTop" aria-label="Share">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>
      <span data-t="share"></span>
    </button>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="hi">हिं</button>
    </div>
  </div>
</header>

<section class="hero" id="top">
  <svg class="toran" id="toran" preserveAspectRatio="none"></svg>
  <div class="mandala" aria-hidden="true"><svg id="mandala" viewBox="-200 -200 400 400"></svg></div>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="hero-in">
    <div class="kicker">॥ श्री राम ॥</div>
    <h1 class="disp"><span data-t="h1"></span><span class="accent" data-t="h1b"></span></h1>
    <p class="sub" data-t="sub"></p>
    <div class="stats">
      <div class="stat"><b>14</b><span data-t="statYears"></span></div>
      <div class="stat"><b id="statStops"></b><span data-t="statStops"></span></div>
      <div class="stat"><b id="statKm"></b><span data-t="statKm"></span></div>
      <div class="stat"><b>2</b><span data-t="statCountries"></span></div>
    </div>
    <div class="cta">
      <button class="btn btn-primary" id="begin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span data-t="begin"></span>
      </button>
      <button class="btn btn-ghost" id="explore"><span data-t="explore"></span></button>
    </div>
  </div>
  <div class="scrollcue" data-t="scroll"></div>
  <div class="diyas" id="diyas" aria-hidden="true"></div>
</section>

<section class="mapwrap" id="mapsec">
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="mapframe"></div>
  <div class="legend" id="legend">
    <button class="chip ram" data-layer="ram"><i></i><span data-t="lgRam"></span></button>
    <button class="chip hanu" data-layer="hanuman"><i></i><span data-t="lgHanu"></span></button>
    <button class="chip push" data-layer="pushpak"><i></i><span data-t="lgPush"></span></button>
    <button class="chip alt" data-layer="alt"><i></i><span data-t="lgAlt"></span></button>

function segPath(s) {
  const pts = s.pts.map((p) => P(p[0], p[1]));
  const bend = s.seg === "ram" ? 0.1 : 0.3;
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let j = 1; j < pts.length; j++) {
    const [x0, y0] = pts[j - 1], [x1, y1] = pts[j];
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
    const sign = s.seg === "ram" ? (s.i % 2 ? 1 : -1) : 1;
    const cx = (x0 + x1) / 2 - (dy / len) * len * bend * sign, cy = (y0 + y1) / 2 + (dx / len) * len * bend * sign;

}

  const dy = `<svg class="diya" viewBox="0 0 64 64"><ellipse cx="32" cy="26" rx="14" ry="18" fill="#ffb347" opacity=".25"/><g class="flame"><path d="M32 8c5 8 8 13 8 18a8 8 0 0 1-16 0c0-5 3-10 8-18z" fill="#ffc23d"/><path d="M32 16c2.5 4 4 7 4 10a4 4 0 0 1-8 0c0-3 1.5-6 4-10z" fill="#fff3c4"/></g><path d="M6 38h52c-2 11-13 18-26 18S8 49 6 38z" fill="#b5361f"/><path d="M6 38h52" stroke="#f3cf76" stroke-width="2"/><path d="M14 44h36" stroke="#f3cf76" stroke-width="1" stroke-dasharray="2 3"/></svg>`;
  $("#diyas").innerHTML = dy.repeat(window.innerWidth < 420 ? 5 : 7);
  // falling marigold petals
  if (!reduce) {
    const p = $("#petals"), cols = ["#f59e0b", "#ea580c", "#fbbf24", "#dc2626"];
    for (let i = 0; i < 22; i++) {
      const e = document.createElement("i"); e.className = "petal";
      e.style.left = Math.random() * 100 + "%"; e.style.background = cols[i % 4];
      e.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      e.style.animationDuration = 7 + Math.random() * 8 + "s"; e.style.animationDelay = -Math.random() * 14 + "s";
      const sz = 9 + Math.random() * 9; e.style.width = e.style.height = sz + "px"; p.appendChild(e);
    }
  }
})();

$("#begin").onclick = () => { $("#mapsec").scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); setTimeout(() => { S.playing = true; updatePlayBtn(); goTo(0, false); }, reduce ? 50 : 650); };
$("#explore").onclick = () => $("#mapsec").scrollIntoView({ behavior: reduce ? "auto" : "smooth" });

/* ---------- start ---------- */
let introDone = false;
function intro() {
  // draw the whole route once, the first time the map comes into view
  if (introDone || reduce) return; introDone = true;
  STOPS.forEach((s, k) => {
    if (!s.pathEl) return; const pe = s.pathEl, len = pe.getTotalLength();
    pe.classList.remove("future");
    pe.style.transition = "none"; pe.style.strokeDasharray = `${len} ${len}`; pe.style.strokeDashoffset = len;
    setTimeout(() => { pe.style.transition = "stroke-dashoffset .5s linear"; pe.style.strokeDashoffset = 0;
      setTimeout(() => { pe.style.transition = ""; pe.style.strokeDasharray = ""; pe.style.strokeDashoffset = ""; refreshMarkers(); }, 560); }, 300 + k * 140);
  });
}
new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting && e.intersectionRatio > 0.5) { if (S.idx < 0 && !S.alt) flyTo(boxFor(ROUTE_BOX), 1); intro(); } }), { threshold: [0.5] }).observe($("#mapsec"));
window.addEventListener("resize", () => { if (S.alt) vb = boxFor(around(S.alt.xy, 30)); else vb = S.idx < 0 ? boxFor(ROUTE_BOX) : boxFor(stopBox(S.idx)); applyVB(); });

applyLang();
vb = boxFor(ROUTE_BOX); applyVB(); refreshMarkers();
const h0 = decodeURIComponent(location.hash.slice(1));
if (h0 && byId[h0] != null) { setTimeout(() => { $("#mapsec").scrollIntoView(); introDone = true; goTo(byId[h0], false); }, 300); }
